name: Build Custom APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 赋予 Gradle 权限
        run: chmod +x ./gradlew

      - name: 打包模版 App
        run: ./gradlew app:buildTemplateApp

      - name: 打包定制主程序 (assembleV6)
        run: ./gradlew app:assembleV6 --stacktrace

      - name: 对生成的 APK 进行自签名与对齐 (Zipalign + Apksigner)
        run: |
          keytool -genkeypair -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias taskhelper -dname "CN=TaskHelper, OU=Utility, O=Android, L=City, ST=State, C=CN" \
            -storepass 123456 -keypass 123456
          
          BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0
          if [ ! -d "$BUILD_TOOLS" ]; then
            BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)
          fi
          echo "Using Build Tools: $BUILD_TOOLS"
          
          mkdir -p build/app/signed
          
          for apk in app/build/outputs/apk/v6/release/*.apk; do
            if [ -f "$apk" ]; then
              base=$(basename "$apk")
              echo "Processing $base..."
              $BUILD_TOOLS/zipalign -v -p 4 "$apk" "build/app/signed/aligned-$base"
              $BUILD_TOOLS/apksigner sign --ks release.jks --ks-pass pass:123456 --key-pass pass:123456 \
                --out "build/app/signed/TaskAssistant-$base" "build/app/signed/aligned-$base"
              rm -f "build/app/signed/aligned-$base"
            fi
          done
          
          echo "=== 最终已签名的 APK 列表 ==="
          ls -lh build/app/signed

      - name: 上传 APK 制品到 GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: TaskAssistant-Custom-APKs
          path: build/app/signed/*.apk
